<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
<div class="login-container">
    <div class="login-image">
        <img src="../images/login-svgrepo-com.svg" alt="Imagine login">
    </div>
    <div class="separator"></div>

    <form class="login-form" id="login-form">
        <h2>Autentificare</h2>
        <input type="email" id="email" placeholder="Adresa de email" required>
        <input type="password" id="password" placeholder="Parola" required>
        <button type="submit">Conecteaza-te</button>
        <p class="register-text">Nu ai cont? <a href="register.html">Inregistrează-te</a></p>
    </form>

</div>
<script src="../JS/login_js.js"></script>
</body>
</html>
