<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - Creează un cont</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
<main class="page">
    <section class="card">
        <h1>Creare Cont</h1>
        <form class="register-form" action="#" method="post" enctype="multipart/form-data">
            <div class="row">
                <label for="username">Nume utilizator</label>
                <input type="text" id="username" name="username" placeholder="ex: ioanaTW" required>
            </div>

            <div class="row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="nume@exemplu.com" required>
            </div>

            <div class="row two-col">
                <div>
                    <label for="password">Parolă</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div>
                    <label for="confirm_password">Confirmă parola</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="row">
                <label for="avatar">Poză profil (opțional)</label>
                <input type="file" id="avatar" name="avatar" accept="image/*">
            </div>

            <div class="actions">
                <button type="submit" class="btn primary">Înregistrează-te</button>
                <button type="reset" class="btn ghost">Resetează</button>
            </div>

            <p class="login-link">
                Ai deja cont? <a href="login.html">Mergi la login</a>
            </p>
        </form>
    </section>
</main>
</body>
</html>
